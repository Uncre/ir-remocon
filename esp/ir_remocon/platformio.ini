; ir-remocon ESP32 ファーム — ビルド検証用の PlatformIO 設定
;
; 目的は「書き込み」ではなく **コンパイルが通ることの確認**。実機は現在停止中で、
; 書き込みは後日ユーザーが Arduino IDE で行う (AGENTS.md の絶対ルール 4)。
;
;   pio run          … ビルドのみ (実機不要)
;   pio run -t upload … 実機書き込み (ポートを指定すること)
;
; ★ Arduino IDE で開く場合、ライブラリマネージャで下の lib_deps と同じものを
;   入れること。特に ArduinoJson は **v6 系** を選ぶこと (v7 は StaticJsonDocument /
;   DynamicJsonDocument を非推奨化しており、このスケッチは v6 API で書かれている)。

[platformio]
src_dir = .          ; .ino をこの ini と同じ階層に置く (Arduino IDE のフォルダ規約と両立させる)

[env:esp32dev]
platform      = espressif32
board         = esp32dev
framework     = arduino
monitor_speed = 115200

lib_deps =
  bblanchon/ArduinoJson @ ^6.21.5
  crankyoldgit/IRremoteESP8266 @ ^2.8.6
  esp32async/ESPAsyncWebServer @ ^3.7.0      ; me-no-dev から esp32async org へ移管された後継。AsyncTCP を自動で引く

build_flags =
  -Wall
